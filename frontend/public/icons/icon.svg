<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Radiant glow behind bible -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Bible Book Open -->
  <g transform="translate(96, 120)">
    <!-- Left Page Base -->
    <path d="M160 210 C100 200 40 220 10 230 L10 50 C40 40 100 20 160 30 Z" fill="#1e293b" />
    <!-- Right Page Base -->
    <path d="M160 210 C220 200 280 220 310 230 L310 50 C280 40 220 20 160 30 Z" fill="#1e293b" />

    <!-- Left Main Page -->
    <path d="M160 200 C105 190 45 208 20 216 L20 38 C45 30 105 12 160 22 Z" fill="url(#pageGrad)" />
    <!-- Right Main Page -->
    <path d="M160 200 C215 190 275 208 300 216 L300 38 C275 30 215 12 160 22 Z" fill="#e2e8f0" />

    <!-- Spine shadow -->
    <path d="M156 22 L164 22 L164 202 L156 202 Z" fill="#94a3b8" />

    <!-- Book Bookmark Ribbon (Gold) -->
    <path d="M156 22 Q160 120 170 230 L160 215 L150 230 Q156 120 156 22" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Text Lines on Pages -->
    <!-- Left page text lines -->
    <line x1="45" y1="65" x2="135" y2="58" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="85" x2="135" y2="78" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="105" x2="135" y2="98" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="125" x2="115" y2="120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="145" x2="135" y2="138" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="165" x2="120" y2="160" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Right page note lines (Highlighted with warm gold) -->
    <line x1="185" y1="58" x2="275" y2="65" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="185" y1="78" x2="275" y2="85" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="98" x2="275" y2="105" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="185" y1="120" x2="255" y2="125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="138" x2="275" y2="145" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="160" x2="245" y2="165" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Pencil / Pen Icon on right page -->
    <g transform="translate(235, 140) rotate(25) scale(0.9)">
      <polygon points="0,0 8,-20 14,-14 6,6" fill="url(#goldGrad)" />
      <polygon points="0,0 2,2 -4,5" fill="#f8fafc" />
    </g>
  </g>

  <!-- Cross symbol subtle at top center -->
  <path d="M256 70 L256 100 M246 80 L266 80" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
</svg>
